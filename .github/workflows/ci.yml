name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FundFlow.sln

      - name: Build (warnings are errors)
        run: dotnet build FundFlow.sln --no-restore --configuration Release

      # `dotnet test` accepts a single project, so each unit-test project gets its own invocation.
      - name: Unit tests
        run: |
          dotnet test tests/FundFlow.Domain.Tests --no-build --configuration Release --logger "trx;LogFileName=domain.trx"
          dotnet test tests/FundFlow.Application.Tests --no-build --configuration Release --logger "trx;LogFileName=application.trx"

      # Testcontainers starts SQL Server itself; the runner provides the Docker daemon.
      - name: Integration tests
        run: >
          dotnet test tests/FundFlow.Api.IntegrationTests
          --no-build --configuration Release --logger "trx;LogFileName=integration.trx"

      - name: Verify EF Core model matches migrations
        run: dotnet tool restore && dotnet ef migrations has-pending-model-changes --project src/FundFlow.Infrastructure --startup-project src/FundFlow.Api

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    name: Infrastructure (Bicep, deploy scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the Bicep templates
        run: |
          az bicep build --file infra/azure/main.bicep --stdout > /dev/null
          az bicep build --file infra/azure/budget.bicep --stdout > /dev/null
          az bicep build --file infra/azure/email-acs.bicep --stdout > /dev/null
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem infra/azure/*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: NuGet vulnerable packages
        run: |
          dotnet restore FundFlow.sln
          dotnet list FundFlow.sln package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -qE "^\s+>" audit.txt; then echo "::error::Vulnerable NuGet packages found"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/FundFlow.Api/Dockerfile
          push: false
          tags: fundflow/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: fundflow/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
