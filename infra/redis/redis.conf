# FundFlow Redis configuration (development defaults; tune per environment).
#
# Redis holds only *derived, expiring* data: permission cache, tenant directory, session deny-list, health probe.
# Losing it is an inconvenience (cold cache), never data loss, so durability settings are relaxed.

bind 0.0.0.0
protected-mode yes
port 6379
# `requirepass` is supplied on the command line from REDIS_PASSWORD (see docker-compose.yml).

# Memory: cap it, and when full evict only keys that carry a TTL (all of ours do) using approximate LRU.
maxmemory 256mb
maxmemory-policy volatile-lru

# Persistence: an append-only file with once-per-second fsync keeps the session deny-list across a restart.
appendonly yes
appendfsync everysec
save ""

# Connection hygiene.
timeout 300
tcp-keepalive 60

# Never let a stray command wipe the cache or attach a debugger.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""

# Logging.
loglevel notice
