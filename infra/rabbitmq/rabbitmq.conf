# FundFlow RabbitMQ configuration (development defaults).
#
# Topology (exchanges, queues, bindings) is declared by MassTransit at startup; nothing is pre-provisioned here.
# Durable queues + the transactional outbox in SQL Server mean a broker restart cannot lose an integration event.

# Do not let the default guest user in from other hosts; the API uses the dedicated RABBITMQ_USER account.
loopback_users.guest = true

# Resource guardrails: block publishers (back-pressure) before the node runs out of RAM or disk.
vm_memory_high_watermark.relative = 0.5
disk_free_limit.absolute = 1GB

# Reject connections that stay idle without heartbeats (dead API instances release their consumers quickly).
heartbeat = 60

# Management UI on 15672.
management.tcp.port = 15672

# Keep logs on stdout so `docker compose logs rabbitmq` shows everything.
log.console = true
log.console.level = info
